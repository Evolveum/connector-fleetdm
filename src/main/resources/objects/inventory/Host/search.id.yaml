objectClasses:
  Host:
    search:
      endpoints:
        - path: hosts/{id}
          singleResult: true
          notFoundIsNoResult: true
          supportedFilters:
            - spec: attribute("id").eq().anySingleValue()
              request: |
                request.pathParameter("id", value)
          objectExtractor: |
            return response.body().path("host")
