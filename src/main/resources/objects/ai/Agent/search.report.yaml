objectClasses:
  Agent:
    search:
      endpoints:
        - path: queries/{id}/report
          notFoundIsNoResult: true
          supportedFilters:
            - spec: attribute("report_id").eq().anySingleValue()
              request: |
                request.pathParameter("id", value)
          objectExtractor: |
            import tools.jackson.databind.json.JsonMapper

            def result = []
            for (def row : response.body().path("results")) {
                def c = row.path("columns")
                if (c.path("type").asString("") != "agents") {
                    continue
                }
                def node = JsonMapper.shared().createObjectNode()
                node.put("host_id", row.path("host_id").asLong())
                node.put("host_name", row.path("host_name").asString(""))
                node.put("last_fetched", row.path("last_fetched").asString(""))
                node.put("report_id", response.body().path("report_id").asString())
                for (def key : ["name", "identifier", "username", "uid", "path", "category", "confidence", "running", "risk_flags", "sha256"]) {
                    node.put(key, c.path(key).asString(""))
                }
                node.put("id", node.path("host_id").asString() + ":" + node.path("username").asString("") + ":" + node.path("identifier").asString("") + ":" + node.path("path").asString(""))
                result << node
            }
            println "fleetdm: Agent extractor, report rows=" + response.body().path("results").size() + " Agent objects=" + result.size()
            return result
